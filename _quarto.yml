project:
  type: book
  output-dir: _book

book:
  title: "Statistilise analüüsi alused"
  subtitle: "Praktikumimaterjalid, 2026 sügis"
  author: "Martin Mölder"
  date: today
  date-format: "DD.MM.YYYY"
  search: true
  chapters:
    - index.qmd
    - part: "Andmetega alustamine"
      chapters:
        - 01-r-alused.qmd
        - 02-andmete-laadimine.qmd
        - 03-kirjeldamine-ja-visualiseerimine.qmd
    - part: "Andmete ettevalmistus"
      chapters:
        - 04-andmete-ettevalmistus-1.qmd
        - 05-andmete-ettevalmistus-2.qmd
    - part: "Järeldav statistika"
      chapters:
        - 06-valim-ja-hupoteesid.qmd
        - 07-keskmiste-vordlemine.qmd
    - part: "Seosed ja mudelid"
      chapters:
        - 08-korrelatsioon.qmd
        - 09-regressioon.qmd
        - 10-mitmene-regressioon.qmd
        - 11-tulemuste-esitamine.qmd
        - 12-logistiline-regressioon.qmd

lang: et

# Eestikeelsed liidesetekstid. Quartol ei ole eesti keele tõlkefaili, seega
# määrame vajalikud stringid ise.
language:
  title-block-author-single: "Autor"
  title-block-author-plural: "Autorid"
  title-block-published: "Avaldatud"
  toc-title-document: "Selle peatüki sisu"
  toc-title-website: "Selle peatüki sisu"
  callout-tip-title: "Nõuanne"
  callout-note-title: "Märkus"
  callout-warning-title: "Hoiatus"
  callout-important-title: "Oluline"
  callout-caution-title: "Ettevaatust"
  search-text-placeholder: "Otsi"
  crossref-fig-title: "Joonis"
  crossref-tbl-title: "Tabel"
  section-title-footnotes: "Viited"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
    fig-width: 7
    fig-height: 4.5
    link-external-icon: false
    # Valemid renderdatakse KaTeX-iga, mis pakitakse saidi sisse kaasa.
    # Vaikimisi laeb Quarto MathJaxi CDN-ist -- see ei tööta, kui fail on
    # avatud otse kettalt (file://) või kui internetiühendust ei ole.
    html-math-method: katex

# Välised lingid avanevad uues aknas (vt _extensions/valised-lingid.lua)
filters:
  - _extensions/valised-lingid.lua

execute:
  warning: false
  message: false
  echo: true
  freeze: auto

knitr:
  opts_chunk:
    comment: "##"
    collapse: false
